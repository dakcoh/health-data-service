spring:
  application:
    name: health-data-service

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/health?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # 세션 설정
  session:
    timeout: 1800  # 30분 (초 단위)

# 비밀번호 암호화 설정
password:
  secret: health
